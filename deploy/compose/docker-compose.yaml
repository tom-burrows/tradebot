services:
  timescaleDB:
    container_name: timescale
    image: timescale/timescaledb:latest-pg17
    ports: 
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER}
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - timescale-data:/var/lib/postgresql/data
  kafka:
    container_name: kafka
    image: apache/kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
    
      # This is where settings for kafka go.
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093 ## Listeners 
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT # maps brokers to a designated security mode (PLAINTEXT, SSL, SASL)
      
      
      KAFKA_NODE_ID: 1 ## Just an id for the Kafka instance
      KAFKA_PROCESS_ROLES: controller,broker # This allows this instance of kafka to broker, and controll (what zookeeper used to do)
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9091" ## Lists which controller nodes can vote on cluster metadata, with one node, it just votes for itself
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER ## The listener brokers use to talk to eachother, irrelevant with one node
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER ## Designates which of the listeners will handle controller traffic

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" ## I think this allows kafka to create topics on it's own, which I don't think I want...


      KAFKA_LOG_DIRS: /var/lib/kafka/data ## Designates where the logs will be stored
      KAFKA_LOG_RETENTION_HOURS: 168 ## How long it stores  logs before deleting them


      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 ## Not sure
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 ## When the first consumer joins a group, kafka waits this long (default 3s) to assign partitions, this just makes dev start up quicker

      #CLUSTER_ID:  ## Not sure
    volumes: ## Decides where to store kafka data so it persists over restarts
      - kafka:/var/lib/kafka/data
  kafka-ui:
    container_name: kafka-ui
    image: kafbat/kafka-ui:main
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
        kafka:
          condition: service_healthy

volumes:
  timescale-data:
  kafka: