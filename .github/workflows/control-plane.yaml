name: control-plane
on:
    push:
        branches:
            - master
        paths:
            - "control-plane/**"
            - "proto/**"
    pull_request:
        branches:
            - master
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-java@v6
              with:
                  java-version: "25"
                  distribution: "oracle-openjdk"
                  cache: maven
            - run: mvn -f control-plan -B verify
            - run: mkdir staging && cp target/*.jar staging
            - uses: actions/upload-artifact@v4
              with:
                  name: Package
                  path: staging
