name: trading-bot
on:
    push:
        branches:
            - master
        paths:
        - "engine/**"
        - "proto/**"
    pull_request:
        branches:
            - master
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                config: [debug, asan-ubsan]
        steps:
          - name: Checkout repository
            uses: actions/checkout@v7
          - name: Install CMake
            uses: lukka/get-cmake@latest
            with:
                cmakeVersion: "3.28"
          - name: Use vcpkg
            uses: lukka/run-vcpkg@v11
          - name: Run CMake and install vcpkg
            uses: lukka/run-cmake@v10
            with:
                cmakeListsTxtPath: '${{github.workspace}}/engine/CMakeLists.txt'
                configurePreset: '${{matrix.config}}'
                buildPreset: '${{matrix.config}}'
                buildPresetAdditionalArgs: "['--preset ${{matrix.config}}']"
                testPreset: '${{matrix.config}}'
                testPresetAdditionalArgs: "['--preset ${{matrix.config}}']"
                    